<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d4f">
<link rel="manifest" href="manifest.json">
<title>モノの記憶</title>
<style>
:root{
  --bg:#f6f4ee; --panel:#ffffff; --ink:#2b2a26; --sub:#726f66;
  --line:#e4e0d6; --accent:#2f5d4f; --accent-ink:#ffffff; --danger:#a83232;
  --radius:10px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#1c1c19; --panel:#262622; --ink:#ece9e1; --sub:#a29d90; --line:#3a3934; --accent:#6fae95; --accent-ink:#14231d; }
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100%;}
h1,h2{font-family:Georgia,"Hiragino Mincho ProN",serif;font-weight:600;margin:0;}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line);}
header h1{font-size:20px;}
header p{margin:4px 0 0;color:var(--sub);font-size:13px;}
main{padding:16px;max-width:560px;margin:0 auto 90px;}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;}
nav.tabs button{flex:1;border:none;background:none;padding:12px 4px;color:var(--sub);font-size:12px;cursor:pointer;}
nav.tabs button.active{color:var(--accent);font-weight:600;}
.view{display:none;} .view.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.btn{display:inline-block;border:none;border-radius:8px;padding:11px 16px;font-size:14px;cursor:pointer;background:var(--accent);color:var(--accent-ink);}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--danger);color:#fff;}
.btn.block{display:block;width:100%;text-align:center;}
.btn:disabled{opacity:.5;}
input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:14px;margin:6px 0 12px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.item-thumb{aspect-ratio:1;width:100%;object-fit:cover;border-radius:8px;background:var(--line);}
.item-name{font-size:13px;margin-top:6px;font-weight:600;}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;background:var(--line);color:var(--sub);margin-top:2px;}
.badge.shared{background:var(--accent);color:var(--accent-ink);}
.preview{width:100%;border-radius:var(--radius);margin-bottom:12px;background:var(--line);max-height:280px;object-fit:cover;}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:40px 10px;}
.status{color:var(--sub);font-size:13px;margin:10px 0;}
.file-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.file-row:last-child{border-bottom:none;}
.match-score{font-size:12px;color:var(--sub);}
label.switch{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0 12px;}
</style>
</head>
<body>
<header>
  <h1>モノの記憶</h1>
  <p id="headerStatus">物体そのものを認識するモデルを読み込み中…（初回のみ数十秒かかります）</p>
</header>
<main>
  <section id="view-list" class="view active">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn secondary" id="backupBtn" style="flex:1;">🔐 バックアップを保存</button>
      <button class="btn secondary" id="restoreBtn" style="flex:1;">📥 復元する</button>
    </div>
    <input type="file" id="restoreFileInput" accept=".encbak" style="display:none;">
    <div id="listEmpty" class="empty">まだ何も登録されていません。「登録」から最初の1件を撮ってみてください。</div>
    <div id="listGrid" class="grid"></div>
  </section>

  <section id="view-add" class="view">
    <div class="card">
      <img id="addPreview" class="preview" style="display:none;">
      <input type="file" accept="image/*" capture="environment" id="addPhotoInput" style="display:none;">
      <button class="btn block" id="addPhotoBtn">📷 写真を撮る</button>
      <input type="text" id="addName" placeholder="名前（例：革の道具箱）">
      <label class="switch"><input type="checkbox" id="addShared"> 家族と共有してよい（エクスポート対象にする）</label>
      <button class="btn block" id="addSaveBtn" disabled>保存する</button>
      <p class="status" id="addStatus"></p>
    </div>
  </section>

  <section id="view-find" class="view">
    <div class="card">
      <img id="findPreview" class="preview" style="display:none;">
      <input type="file" accept="image/*" capture="environment" id="findPhotoInput" style="display:none;">
      <button class="btn block" id="findPhotoBtn">📷 撮って探す</button>
      <p class="status" id="findStatus"></p>
    </div>
    <div id="findResult"></div>
  </section>

  <section id="view-detail" class="view">
    <button class="btn secondary" id="detailBack">← 一覧へ戻る</button>
    <div class="card" style="margin-top:10px;">
      <img id="detailPhoto" class="preview">
      <h2 id="detailName" style="font-size:18px;"></h2>
      <label class="switch"><input type="checkbox" id="detailShared"> 家族と共有してよい</label>
      <button class="btn danger" id="detailDelete">🗑️ この記録を削除</button>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="font-size:14px;">紐づけたファイル</b>
        <button class="btn secondary" id="detailAddFile">＋ 追加</button>
      </div>
      <input type="file" id="detailFileInput" multiple style="display:none;">
      <div id="detailFiles"></div>
    </div>
  </section>
</main>

<footer style="max-width:560px;margin:0 auto 100px;padding:0 16px;color:var(--sub);font-size:11px;line-height:1.6;">
  データはすべてこの端末内にのみ保存され、外部に送信されることはありません。<br>
  画像認識には <a href="https://github.com/facebookresearch/dino" style="color:var(--sub);">DINO</a>（Meta AI, Apache License 2.0）と
  <a href="https://github.com/huggingface/transformers.js" style="color:var(--sub);">Transformers.js</a>（Hugging Face, Apache License 2.0）を利用しています。
</footer>

<nav class="tabs">
  <button data-view="list" class="active">📚 一覧</button>
  <button data-view="add">📷 登録</button>
  <button data-view="find">🔍 探す</button>
</nav>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

// モデルファイルはブラウザのCache Storageに自動保存される（Transformers.jsの標準動作）。
// 初回だけオンラインが必要で、以降は完全オフラインで動作する。
env.allowLocalModels = false;

const MATCH_THRESHOLD = 0.75; // DINOの埋め込みでの類似度しきい値。実際に試しながら調整してください
let db, extractor, addBlob=null, addEmbedding=null, findBlob=null, currentDetailId=null;

function openDb(){
  return new Promise((resolve,reject)=>{
    try{
      const req = indexedDB.open('mono-no-kioku', 1);
      req.onupgradeneeded = e => { e.target.result.createObjectStore('items',{keyPath:'id'}); };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject(req.error);
    }catch(err){ reject(err); }
  });
}
function idbAll(){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readonly').objectStore('items').getAll(); tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error); }); }
function idbPut(item){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readwrite').objectStore('items').put(item); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbDelete(id){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readwrite').objectStore('items').delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbGet(id){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readonly').objectStore('items').get(id); tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error); }); }

// DINOで画像の埋め込みベクトルを計算する（物体の輪郭・テクスチャに強く反応する）
async function embed(blob){
  const url = URL.createObjectURL(blob);
  const output = await extractor(url, { pooling: 'mean', normalize: true });
  URL.revokeObjectURL(url);
  return Array.from(output.data);
}
function cosine(a,b){
  let dot=0; for(let i=0;i<a.length;i++) dot+=a[i]*b[i];
  return dot; // normalize:true 済みなので内積=コサイン類似度
}

function showView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='list') renderList();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.view));

async function renderList(){
  const items = await idbAll();
  const grid = document.getElementById('listGrid');
  document.getElementById('listEmpty').style.display = items.length ? 'none' : 'block';
  grid.innerHTML='';
  items.sort((a,b)=>b.createdAt-a.createdAt).forEach(it=>{
    const div = document.createElement('div');
    div.innerHTML = `<img class="item-thumb" src="${URL.createObjectURL(it.photo)}">
      <div class="item-name">${escapeHtml(it.name)}</div>
      <span class="badge ${it.shared?'shared':''}">${it.shared?'共有可':'プライベート'}</span>`;
    div.style.cursor='pointer';
    div.onclick=()=>openDetail(it.id);
    grid.appendChild(div);
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

document.getElementById('addPhotoBtn').onclick = ()=>document.getElementById('addPhotoInput').click();
document.getElementById('addPhotoInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  addBlob = file;
  const img = document.getElementById('addPreview');
  img.src = URL.createObjectURL(file); img.style.display='block';
  document.getElementById('addStatus').textContent = '特徴を解析中…';
  addEmbedding = await embed(file);
  document.getElementById('addStatus').textContent = '';
  document.getElementById('addSaveBtn').disabled=false;
};
document.getElementById('addSaveBtn').onclick = async ()=>{
  const name = document.getElementById('addName').value.trim() || '名前未設定';
  const shared = document.getElementById('addShared').checked;
  const item = { id:'item_'+Date.now()+'_'+Math.random().toString(16).slice(2,8), name, photo:addBlob, embedding:addEmbedding, shared, files:[], createdAt:Date.now() };
  await idbPut(item);
  addBlob=null; addEmbedding=null;
  document.getElementById('addName').value=''; document.getElementById('addShared').checked=false;
  document.getElementById('addPreview').style.display='none';
  document.getElementById('addSaveBtn').disabled=true;
  document.getElementById('addStatus').textContent='保存しました。';
  setTimeout(()=>document.getElementById('addStatus').textContent='',1500);
};

document.getElementById('findPhotoBtn').onclick = ()=>document.getElementById('findPhotoInput').click();
document.getElementById('findPhotoInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  findBlob = file;
  const img = document.getElementById('findPreview');
  img.src = URL.createObjectURL(file); img.style.display='block';
  document.getElementById('findResult').innerHTML='';
  document.getElementById('findStatus').textContent='照合中…';
  const emb = await embed(file);
  const items = await idbAll();
  let best=null, bestScore=-1;
  items.forEach(it=>{ const s=cosine(emb, it.embedding); if(s>bestScore){bestScore=s; best=it;} });
  document.getElementById('findStatus').textContent='';
  const resultDiv = document.getElementById('findResult');
  if(best && bestScore >= MATCH_THRESHOLD){
    resultDiv.innerHTML = `<div class="card"><b>一致する記録が見つかりました</b><span class="match-score"> （類似度 ${(bestScore*100).toFixed(0)}%）</span></div>`;
    const btn = document.createElement('button');
    btn.className='btn block'; btn.textContent=`「${best.name}」を開く`;
    btn.onclick=()=>openDetail(best.id);
    resultDiv.appendChild(btn);
  } else {
    resultDiv.innerHTML = `<div class="card">一致するものは見つかりませんでした。${best?`（最も近い候補との類似度 ${(bestScore*100).toFixed(0)}%）`:''}</div>`;
    const btn = document.createElement('button');
    btn.className='btn secondary block'; btn.textContent='新しく登録する';
    btn.onclick=()=>{ addBlob=findBlob; addEmbedding=emb; document.getElementById('addPreview').src=img.src; document.getElementById('addPreview').style.display='block'; document.getElementById('addSaveBtn').disabled=false; showView('add'); };
    resultDiv.appendChild(btn);
  }
};

async function openDetail(id){
  currentDetailId = id;
  const it = await idbGet(id);
  document.getElementById('detailPhoto').src = URL.createObjectURL(it.photo);
  document.getElementById('detailName').textContent = it.name;
  document.getElementById('detailShared').checked = !!it.shared;
  renderDetailFiles(it.files||[]);
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-detail').classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
}
document.getElementById('detailBack').onclick = ()=>showView('list');
document.getElementById('detailShared').onchange = async (e)=>{
  const it = await idbGet(currentDetailId); it.shared = e.target.checked; await idbPut(it);
};
document.getElementById('detailDelete').onclick = async ()=>{
  if(confirm('この記録と紐づくファイルをすべて削除しますか？')){ await idbDelete(currentDetailId); showView('list'); }
};
function renderDetailFiles(files){
  const box = document.getElementById('detailFiles');
  box.innerHTML = files.length ? '' : '<p class="status">まだファイルがありません。</p>';
  files.forEach((f,i)=>{
    const row = document.createElement('div'); row.className='file-row';
    row.innerHTML = `<span>📎 ${escapeHtml(f.name)}</span>`;
    const btns = document.createElement('span');
    const openBtn = document.createElement('a'); openBtn.textContent='開く'; openBtn.href=URL.createObjectURL(f.blob); openBtn.target='_blank'; openBtn.style.marginRight='10px';
    const delBtn = document.createElement('button'); delBtn.textContent='削除'; delBtn.className='btn secondary'; delBtn.style.padding='4px 8px'; delBtn.style.fontSize='12px';
    delBtn.onclick = async ()=>{ const it=await idbGet(currentDetailId); it.files.splice(i,1); await idbPut(it); renderDetailFiles(it.files); };
    btns.appendChild(openBtn); btns.appendChild(delBtn);
    row.appendChild(btns); box.appendChild(row);
  });
}
document.getElementById('detailAddFile').onclick = ()=>document.getElementById('detailFileInput').click();
document.getElementById('detailFileInput').onchange = async (e)=>{
  const it = await idbGet(currentDetailId);
  it.files = it.files||[];
  for(const f of e.target.files){ it.files.push({name:f.name, blob:f}); }
  await idbPut(it);
  renderDetailFiles(it.files);
  e.target.value='';
};

// --- 暗号化バックアップ（AES-256-GCM）---
// ブラウザのサイトデータ削除の影響を受けない、端末の正規のファイル領域（Filesアプリ等）に
// 暗号化した状態で書き出す。復元時は同じパスワードで復号する。
async function deriveKey(password, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptBytes(password, plainBytes){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plainBytes);
  const out = new Uint8Array(salt.length + iv.length + cipher.byteLength);
  out.set(salt,0); out.set(iv, salt.length); out.set(new Uint8Array(cipher), salt.length+iv.length);
  return out;
}
async function decryptBytes(password, bytes){
  const salt = bytes.slice(0,16), iv = bytes.slice(16,28), cipher = bytes.slice(28);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  return new Uint8Array(plain);
}
function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64, type){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type});
}

document.getElementById('backupBtn').onclick = async ()=>{
  const password = await showPrompt('バックアップを暗号化するパスワードを決めてください（復元時に必要です）');
  if(!password) return;
  const items = await idbAll();
  const serial = [];
  for(const it of items){
    const files = [];
    for(const f of (it.files||[])) files.push({name:f.name, type:f.blob.type, data: await blobToBase64(f.blob)});
    serial.push({ id:it.id, name:it.name, embedding:it.embedding, shared:it.shared, createdAt:it.createdAt,
      photo: await blobToBase64(it.photo), photoType: it.photo.type, files });
  }
  const jsonBytes = new TextEncoder().encode(JSON.stringify(serial));
  const encrypted = await encryptBytes(password, jsonBytes);
  const blob = new Blob([encrypted], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `mono-no-kioku-backup-${Date.now()}.encbak`;
  document.body.appendChild(a); a.click(); a.remove();
  alert(`バックアップを書き出しました（${items.length}件）。「ファイルに保存」を選ぶと、ブラウザのデータを消してもこのファイルは残ります。パスワードは忘れずに控えておいてください。`);
};

document.getElementById('restoreBtn').onclick = ()=>document.getElementById('restoreFileInput').click();
document.getElementById('restoreFileInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  e.target.value='';
  const password = await showPrompt('バックアップのパスワードを入力してください');
  if(!password) return;
  try{
    const bytes = new Uint8Array(await file.arrayBuffer());
    const plain = await decryptBytes(password, bytes);
    const serial = JSON.parse(new TextDecoder().decode(plain));
    for(const it of serial){
      const photo = base64ToBlob(it.photo, it.photoType);
      const files = (it.files||[]).map(f=>({name:f.name, blob: base64ToBlob(f.data, f.type)}));
      await idbPut({ id:it.id, name:it.name, embedding:it.embedding, shared:it.shared, createdAt:it.createdAt, photo, files });
    }
    alert(`復元しました（${serial.length}件）。`);
    renderList();
  }catch(err){
    alert('復元に失敗しました。パスワードが違うか、ファイルが壊れている可能性があります。');
  }
};

(async function init(){
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  try{ db = await openDb(); }catch(err){ document.body.innerHTML = '<p style="padding:20px;">このブラウザではデータ保存に対応していません。</p>'; return; }
  try{
    extractor = await pipeline('image-feature-extraction', 'Xenova/dino-vits16', { quantized: true });
  }catch(err){
    document.getElementById('headerStatus').textContent = 'モデルの読み込みに失敗しました。初回は通信環境の良い場所でお試しください。';
    console.error(err);
    return;
  }
  document.getElementById('headerStatus').textContent = '写真で物を覚えておき、あとで撮って探せます。データは端末内のみに保存されます。';
  renderList();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
