<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2a26">
<link rel="manifest" href="manifest.json">
<title>モノの記憶</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --ink:#242422; --sub:#706e68;
  --line:#e2ded4; --accent:#3a3833; --accent-ink:#ffffff; --danger:#8c2e2e;
  --warn:#8a6418; --warn-bg:#fdf9ed; --warn-border:#eddcb4;
  --radius:6px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#181816; --panel:#21211e; --ink:#e8e6df; --sub:#8e8b82;
    --line:#33322d; --accent:#e8e6df; --accent-ink:#181816; --danger:#b54545;
    --warn:#d4aa55; --warn-bg:#262218; --warn-border:#423924;
  }
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100%;
}
header{
  position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px 12px;
  border-bottom:1px solid var(--line);
}
header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:0.02em;}
header p{margin:4px 0 0;color:var(--sub);font-size:12px;word-break:break-all;}
main{padding:16px;max-width:560px;margin:0 auto 90px;}
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;
}
nav.tabs button{
  flex:1;border:none;background:none;padding:14px 4px;
  color:var(--sub);font-size:12px;letter-spacing:0.04em;cursor:pointer;
}
nav.tabs button.active{color:var(--ink);font-weight:600;}
.view{display:none;} .view.active{display:block;}
.card{
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px;margin-bottom:12px;
}
.btn{
  display:inline-block;border:none;border-radius:var(--radius);
  padding:10px 16px;font-size:13px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);letter-spacing:0.02em;
}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.danger{background:var(--danger);color:#ffffff;}
.btn.block{display:block;width:100%;text-align:center;}
.btn:disabled{opacity:0.4;cursor:default;}
input[type=text], select, textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--panel);color:var(--ink);font-size:13px;margin:6px 0 12px;
  box-sizing:border-box;font-family:inherit;
}
textarea{min-height:80px;resize:vertical;}
label.field-label{font-size:12px;color:var(--sub);display:block;margin-top:4px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.item-thumb{
  aspect-ratio:1;width:100%;object-fit:cover;
  border-radius:var(--radius);background:var(--line);
}
.item-thumb.masked{
  display:flex;align-items:center;justify-content:center;
  color:var(--sub);font-size:11px;border:1px dashed var(--line);background:transparent;
}
.item-name{font-size:13px;margin-top:6px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.preview{
  width:100%;border-radius:var(--radius);margin-bottom:12px;
  background:var(--line);max-height:280px;object-fit:cover;
}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:48px 10px;line-height:1.6;}
.status{color:var(--sub);font-size:12px;margin:10px 0;}
.file-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.file-row:last-child{border-bottom:none;}
.match-score{font-size:12px;color:var(--sub);margin-left:4px;}
.notice-box{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;font-size:12px;color:var(--sub);line-height:1.5;margin-bottom:12px;
}
.warn-box{
  background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn);
  border-radius:var(--radius);padding:12px;font-size:12px;line-height:1.5;margin-bottom:12px;
}
</style>
</head>
<body>
<header>
  <h1>モノの記憶</h1>
  <p id="headerStatus">初期化中...</p>
</header>
<main>
  <!-- 一覧画面 -->
  <section id="view-list" class="view active">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn secondary" id="backupAllBtn" style="flex:1;">バックアップ保存</button>
      <button class="btn secondary" id="restoreBtn" style="flex:1;">復元 / 読込</button>
    </div>
    <input type="file" id="restoreFileInput" accept=".encbak" style="display:none;">
    <div id="listEmpty" class="empty">登録されている記録はありません。<br>「登録」から対象の現物を撮影してください。</div>
    <div id="listGrid" class="grid"></div>
  </section>

  <!-- 登録画面 -->
  <section id="view-add" class="view">
    <div class="card">
      <img id="addPreview" class="preview" style="display:none;">
      <input type="file" accept="image/*" capture="environment" id="addPhotoInput" style="display:none;">
      <button class="btn block" id="addPhotoBtn">写真を撮影</button>
      
      <!-- 重複検知時の警告枠 -->
      <div id="addDuplicateBox" class="warn-box" style="display:none;margin-top:12px;">
        <div id="addDuplicateMsg" style="font-weight:600;margin-bottom:6px;"></div>
        <div style="color:var(--ink);font-size:11px;margin-bottom:10px;">
          同一の物体を二重登録すると、照合時に意図しないデータが呼び出される可能性があります。
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn secondary" id="addOpenExistingBtn" style="flex:1;padding:6px;font-size:11px;">既存の記録を開く</button>
          <button class="btn secondary" id="addIgnoreDuplicateBtn" style="flex:1;padding:6px;font-size:11px;">重複を許容する</button>
        </div>
      </div>

      <label class="field-label" style="margin-top:12px;">識別名</label>
      <input type="text" id="addName" placeholder="記録の名称">
      
      <label class="field-label">メモ</label>
      <textarea id="addNote" placeholder="任意のテキスト"></textarea>
      
      <label class="field-label">保護設定</label>
      <select id="addSecurity">
        <option value="standard">標準（常にすべて表示）</option>
        <option value="file-lock">ファイル制限（現物照合までファイルを不可視化）</option>
        <option value="masked">マスク（現物照合まで外観・内容を伏せる）</option>
        <option value="hidden">非表示（一覧から除外、現物照合時のみ展開）</option>
      </select>
      
      <button class="btn block" id="addSaveBtn" disabled>保存</button>
      <p class="status" id="addStatus"></p>
    </div>
  </section>

  <!-- 照合画面 -->
  <section id="view-find" class="view">
    <div class="card">
      <img id="findPreview" class="preview" style="display:none;">
      <input type="file" accept="image/*" capture="environment" id="findPhotoInput" style="display:none;">
      <button class="btn block" id="findPhotoBtn">現物を撮影して照合</button>
      <p class="status" id="findStatus"></p>
    </div>
    <div id="findResult"></div>
  </section>

  <!-- 詳細・編集画面 -->
  <section id="view-detail" class="view">
    <button class="btn secondary" id="detailBack" style="margin-bottom:10px;">← 一覧へ戻る</button>
    
    <div id="detailLockNotice" class="notice-box" style="display:none;">
      保護されています。ファイルや詳細情報の閲覧・編集には、現物の照合が必要です。
    </div>

    <div class="card">
      <img id="detailPhoto" class="preview">
      <h2 id="detailName" style="font-size:16px;font-weight:600;margin:0 0 8px;"></h2>
      
      <label class="field-label">メモ</label>
      <textarea id="detailNote" placeholder="メモ"></textarea>
      
      <label class="field-label">保護設定</label>
      <select id="detailSecurity">
        <option value="standard">標準</option>
        <option value="file-lock">ファイル制限</option>
        <option value="masked">マスク</option>
        <option value="hidden">非表示</option>
      </select>
    </div>

    <div class="card" id="detailFilesCard">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <span style="font-size:13px;font-weight:600;">紐づけファイル</span>
        <button class="btn secondary" id="detailAddFile" style="padding:6px 12px;font-size:12px;">追加</button>
      </div>
      <input type="file" id="detailFileInput" multiple style="display:none;">
      <div id="detailFiles" style="margin-top:8px;"></div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn secondary" id="detailExportBtn">この記録を暗号化エクスポート</button>
      <button class="btn danger" id="detailDeleteBtn">記録を削除</button>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-view="list" class="active">一覧</button>
  <button data-view="add">登録</button>
  <button data-view="find">照合</button>
</nav>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

env.allowLocalModels = false;

const MATCH_THRESHOLD = 0.75;
const DUPLICATE_THRESHOLD = 0.82; // 重複と判定するしきい値

let db, extractor, addBlob=null, addEmbedding=null, findBlob=null, currentDetailId=null;
let duplicateCandidateId = null;

const unlockedSessions = new Set();

function lockAllSessions(){
  if(unlockedSessions.size > 0){
    unlockedSessions.clear();
    const activeView = document.querySelector('.view.active')?.id;
    if(activeView === 'view-detail') showView('list');
    else if(activeView === 'view-list') renderList();
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) lockAllSessions();
});

function openDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('mono-no-kioku', 3);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', {keyPath:'id'});
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}
function idbAll(){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readonly').objectStore('items').getAll(); tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error); }); }
function idbPut(item){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readwrite').objectStore('items').put(item); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbDelete(id){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readwrite').objectStore('items').delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbGet(id){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readonly').objectStore('items').get(id); tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error); }); }

async function downscaleImage(file, maxSide = 1000, quality = 0.85){
  const bmp = await createImageBitmap(file);
  let { width, height } = bmp;
  if (width > maxSide || height > maxSide) {
    if (width > height) {
      height = Math.round((height * maxSide) / width);
      width = maxSide;
    } else {
      width = Math.round((width * maxSide) / height);
      height = maxSide;
    }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bmp, 0, 0, width, height);
  bmp.close();
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

async function embed(blob){
  const url = URL.createObjectURL(blob);
  try {
    const output = await extractor(url);
    const hiddenDim = 384;
    const rawData = output.data;
    const cls = new Float32Array(hiddenDim);
    for (let i = 0; i < hiddenDim; i++) cls[i] = rawData[i];

    let sumSq = 0;
    for (let i = 0; i < hiddenDim; i++) sumSq += cls[i] * cls[i];
    const norm = Math.sqrt(sumSq) || 1.0;

    const embedding = new Array(hiddenDim);
    for (let i = 0; i < hiddenDim; i++) embedding[i] = cls[i] / norm;
    return embedding;
  } finally {
    URL.revokeObjectURL(url);
  }
}

function cosine(a, b){
  if (!a || !b || a.length !== b.length) return 0;
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return Math.max(-1, Math.min(1, dot));
}

function showView(name){
  if(name === 'list') lockAllSessions();
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='list') renderList();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>showView(b.dataset.view));

async function renderList(){
  const allItems = await idbAll();
  const items = allItems.filter(it => it.security !== 'hidden');
  const grid = document.getElementById('listGrid');
  document.getElementById('listEmpty').style.display = items.length ? 'none' : 'block';
  grid.innerHTML='';
  
  items.sort((a,b)=>b.createdAt-a.createdAt).forEach(it=>{
    const div = document.createElement('div');
    const isMasked = (it.security === 'masked');

    if(isMasked){
      div.innerHTML = `<div class="item-thumb masked">保護中</div><div class="item-name" style="color:var(--sub);">保護された記録</div>`;
    } else {
      const imgUrl = URL.createObjectURL(it.photo);
      div.innerHTML = `<img class="item-thumb" src="${imgUrl}"><div class="item-name">${escapeHtml(it.name)}</div>`;
    }
    div.style.cursor='pointer';
    div.onclick=()=>openDetail(it.id);
    grid.appendChild(div);
  });
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

// 登録処理
document.getElementById('addPhotoBtn').onclick = ()=>document.getElementById('addPhotoInput').click();
document.getElementById('addPhotoInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  
  // UIリセット
  document.getElementById('addDuplicateBox').style.display = 'none';
  duplicateCandidateId = null;
  document.getElementById('addSaveBtn').disabled = true;

  document.getElementById('addStatus').textContent = '最適化中...';
  addBlob = await downscaleImage(file);
  
  const img = document.getElementById('addPreview');
  img.src = URL.createObjectURL(addBlob);
  img.style.display = 'block';
  
  document.getElementById('addStatus').textContent = '特徴抽出・重複確認中...';
  addEmbedding = await embed(addBlob);

  // 既存データとの重複スキャン
  const items = await idbAll();
  let maxScore = -1, candidate = null;
  for(const it of items){
    const s = cosine(addEmbedding, it.embedding);
    if(s > maxScore){ maxScore = s; candidate = it; }
  }

  document.getElementById('addStatus').textContent = '完了';

  if(candidate && maxScore >= DUPLICATE_THRESHOLD){
    duplicateCandidateId = candidate.id;
    const isSecret = (candidate.security === 'masked' || candidate.security === 'hidden');
    const targetLabel = isSecret ? '保護された記録' : `「${candidate.name}」`;
    
    document.getElementById('addDuplicateMsg').textContent = 
      `既存の${targetLabel}と類似しています（一致率 ${(maxScore*100).toFixed(0)}%）`;
    document.getElementById('addDuplicateBox').style.display = 'block';
    // 警告が出た場合は判断を促すため保存ボタンを初期無効化
    document.getElementById('addSaveBtn').disabled = true;
  } else {
    document.getElementById('addSaveBtn').disabled = false;
  }
};

// 重複警告の分岐アクション
document.getElementById('addOpenExistingBtn').onclick = ()=>{
  if(!duplicateCandidateId) return;
  // 照合したものとみなしセッション解除して遷移
  unlockedSessions.add(duplicateCandidateId);
  openDetail(duplicateCandidateId);
};
document.getElementById('addIgnoreDuplicateBtn').onclick = ()=>{
  document.getElementById('addDuplicateBox').style.display = 'none';
  document.getElementById('addSaveBtn').disabled = false;
};

document.getElementById('addSaveBtn').onclick = async ()=>{
  const name = document.getElementById('addName').value.trim() || '名称未設定';
  const note = document.getElementById('addNote').value.trim();
  const security = document.getElementById('addSecurity').value;
  const item = {
    id:'item_'+Date.now()+'_'+Math.random().toString(16).slice(2,8),
    name, note, security, photo:addBlob, embedding:addEmbedding,
    files:[], createdAt:Date.now()
  };
  await idbPut(item);
  addBlob=null; addEmbedding=null; duplicateCandidateId=null;
  document.getElementById('addName').value='';
  document.getElementById('addNote').value='';
  document.getElementById('addSecurity').value='standard';
  document.getElementById('addPreview').style.display='none';
  document.getElementById('addDuplicateBox').style.display='none';
  document.getElementById('addSaveBtn').disabled=true;
  document.getElementById('addStatus').textContent='';
  showView('list');
};

// 照合処理
document.getElementById('findPhotoBtn').onclick = ()=>document.getElementById('findPhotoInput').click();
document.getElementById('findPhotoInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('findStatus').textContent='最適化中...';
  findBlob = await downscaleImage(file);
  
  const img = document.getElementById('findPreview');
  img.src = URL.createObjectURL(findBlob);
  img.style.display='block';
  document.getElementById('findResult').innerHTML='';
  document.getElementById('findStatus').textContent='照合中...';
  
  const emb = await embed(findBlob);
  const items = await idbAll();
  let best=null, bestScore=-1;
  items.forEach(it=>{ const s=cosine(emb, it.embedding); if(s>bestScore){bestScore=s; best=it;} });
  document.getElementById('findStatus').textContent='';
  
  const resultDiv = document.getElementById('findResult');
  if(best && bestScore >= MATCH_THRESHOLD){
    unlockedSessions.add(best.id);

    resultDiv.innerHTML = `<div class="card">照合成功<span class="match-score">（一致率 ${(bestScore*100).toFixed(0)}%）</span></div>`;
    const btn = document.createElement('button');
    btn.className='btn block'; 
    btn.textContent = (best.security === 'masked' || best.security === 'hidden') ? '解除して開く' : `「${best.name}」を開く`;
    btn.onclick=()=>openDetail(best.id);
    resultDiv.appendChild(btn);
  } else {
    resultDiv.innerHTML = `<div class="card">一致する記録はありません。${best?`<span class="match-score">（最高一致率 ${(bestScore*100).toFixed(0)}%）</span>`:''}</div>`;
    const btn = document.createElement('button');
    btn.className='btn secondary block'; btn.textContent='この写真で新しく登録する';
    btn.onclick=()=>{
      addBlob = findBlob; addEmbedding = emb;
      document.getElementById('addPreview').src = img.src;
      document.getElementById('addPreview').style.display = 'block';
      document.getElementById('addSaveBtn').disabled = false;
      showView('add');
    };
    resultDiv.appendChild(btn);
  }
};

// 詳細表示
async function openDetail(id){
  currentDetailId = id;
  const it = await idbGet(id);
  const isUnlocked = unlockedSessions.has(id);
  const sec = it.security || 'standard';

  const lockNotice = document.getElementById('detailLockNotice');
  const photoEl = document.getElementById('detailPhoto');
  const nameEl = document.getElementById('detailName');
  const noteEl = document.getElementById('detailNote');
  const secEl = document.getElementById('detailSecurity');
  const filesCard = document.getElementById('detailFilesCard');

  secEl.value = sec;

  if(sec === 'masked' && !isUnlocked){
    lockNotice.style.display = 'block';
    photoEl.style.display = 'none';
    nameEl.textContent = '保護された記録';
    noteEl.value = '';
    noteEl.disabled = true;
    secEl.disabled = true;
    filesCard.style.display = 'none';
  } else {
    lockNotice.style.display = (sec !== 'standard' && !isUnlocked) ? 'block' : 'none';
    photoEl.src = URL.createObjectURL(it.photo);
    photoEl.style.display = 'block';
    nameEl.textContent = it.name;
    noteEl.value = it.note || '';
    noteEl.disabled = false;
    secEl.disabled = false;

    if(sec === 'file-lock' && !isUnlocked){
      filesCard.style.display = 'none';
    } else {
      filesCard.style.display = 'block';
      renderDetailFiles(it.files||[]);
    }
  }

  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-detail').classList.add('active');
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
}

document.getElementById('detailBack').onclick = ()=>showView('list');

document.getElementById('detailNote').onchange = async (e)=>{
  const it = await idbGet(currentDetailId); it.note = e.target.value; await idbPut(it);
};
document.getElementById('detailSecurity').onchange = async (e)=>{
  const it = await idbGet(currentDetailId); it.security = e.target.value; await idbPut(it);
};
document.getElementById('detailDeleteBtn').onclick = async ()=>{
  if(confirm('この記録と紐づくファイルを削除しますか？')){
    unlockedSessions.delete(currentDetailId);
    await idbDelete(currentDetailId);
    showView('list');
  }
};

function renderDetailFiles(files){
  const box = document.getElementById('detailFiles');
  box.innerHTML = files.length ? '' : '<p class="status">紐づいたファイルはありません。</p>';
  files.forEach((f,i)=>{
    const row = document.createElement('div'); row.className='file-row';
    row.innerHTML = `<span>${escapeHtml(f.name)}</span>`;
    const btns = document.createElement('span');
    const openBtn = document.createElement('a'); openBtn.textContent='取得'; openBtn.href=URL.createObjectURL(f.blob); openBtn.download=f.name; openBtn.style.marginRight='12px'; openBtn.style.fontSize='12px';
    const delBtn = document.createElement('button'); delBtn.textContent='削除'; delBtn.className='btn secondary'; delBtn.style.padding='3px 8px'; delBtn.style.fontSize='11px';
    delBtn.onclick = async ()=>{ const it=await idbGet(currentDetailId); it.files.splice(i,1); await idbPut(it); renderDetailFiles(it.files); };
    btns.appendChild(openBtn); btns.appendChild(delBtn);
    row.appendChild(btns); box.appendChild(row);
  });
}

// 暗号化基盤（AES-256-GCM + PBKDF2）
async function deriveKey(password, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptBytes(password, plainBytes){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plainBytes);
  const out = new Uint8Array(salt.length + iv.length + cipher.byteLength);
  out.set(salt,0); out.set(iv, salt.length); out.set(new Uint8Array(cipher), salt.length+iv.length);
  return out;
}
async function decryptBytes(password, bytes){
  const salt = bytes.slice(0,16), iv = bytes.slice(16,28), cipher = bytes.slice(28);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  return new Uint8Array(plain);
}
function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64, type){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type});
}

async function exportItemsEncrypted(items, defaultFileName){
  const password = prompt('暗号化パスワードを設定してください:');
  if(!password) return;
  const serial = [];
  for(const it of items){
    const files = [];
    for(const f of (it.files||[])) files.push({name:f.name, type:f.blob.type, data: await blobToBase64(f.blob)});
    serial.push({ id:it.id, name:it.name, note:it.note||'', security:it.security||'standard',
      embedding:it.embedding, createdAt:it.createdAt, photo: await blobToBase64(it.photo),
      photoType: it.photo.type, files });
  }
  const jsonBytes = new TextEncoder().encode(JSON.stringify(serial));
  const encrypted = await encryptBytes(password, jsonBytes);
  const blob = new Blob([encrypted], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = defaultFileName;
  document.body.appendChild(a); a.click(); a.remove();
}

};

document.getElementById('restoreBtn').onclick = ()=>document.getElementById('restoreFileInput').click();
document.getElementById('restoreFileInput').onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  e.target.value='';
  const password = prompt('復号パスワードを入力してください:');
  if(!password) return;
  try{
    const bytes = new Uint8Array(await file.arrayBuffer());
    const plain = await decryptBytes(password, bytes);
    const serial = JSON.parse(new TextDecoder().decode(plain));
    for(const it of serial){
      const photo = base64ToBlob(it.photo, it.photoType);
      const files = (it.files||[]).map(f=>({name:f.name, blob: base64ToBlob(f.data, f.type)}));
      await idbPut({ id:it.id, name:it.name, note:it.note||'', security:it.security||'standard',
        embedding:it.embedding, createdAt:it.createdAt, photo, files });
    }
    alert(`${serial.length}件の記録を読み込みました。`);
    renderList();
  }catch(err){
    alert('復号に失敗しました。パスワードが誤っているか、ファイルが破損しています。');
  }
};
