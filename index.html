<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121211">
<link rel="manifest" href="manifest.json">
<title>モノの記憶</title>
<style>
:root{
  --bg:#f4f2ec;
  --panel:#ebe8df;
  --panel-active:#ffffff;
  --ink:#1c1b18;
  --sub:#76736a;
  --line:#d6d1c4;
  --line-strong:#1c1b18;
  --accent:#1c1b18;
  --accent-ink:#f4f2ec;
  --danger:#8e2a2a;
  --warn:#7a5813;
  --warn-bg:#ece5d0;
  --mono:ui-monospace, "SF Mono", "Roboto Mono", "Courier New", monospace;
  --serif:"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413;
    --panel:#1c1c1a;
    --panel-active:#242422;
    --ink:#e4e1d7;
    --sub:#828076;
    --line:#2c2c28;
    --line-strong:#e4e1d7;
    --accent:#e4e1d7;
    --accent-ink:#141413;
    --danger:#c24b4b;
    --warn:#c9993b;
    --warn-bg:#262114;
  }
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}

header{
  position:sticky;top:0;z-index:10;background:var(--bg);
  padding:calc(18px + env(safe-area-inset-top,0px)) 20px 14px;
  border-bottom:2px solid var(--line-strong);
  display:flex;justify-content:space-between;align-items:flex-end;
}
header .title-area h1{
  font-family:var(--serif);font-size:18px;font-weight:600;letter-spacing:0.08em;
}
header .title-area p{
  font-family:var(--mono);font-size:10px;color:var(--sub);margin-top:4px;letter-spacing:0.02em;
}
header .status-tag{
  font-family:var(--mono);font-size:10px;padding:2px 6px;
  border:1px solid var(--line);color:var(--sub);text-transform:uppercase;
}

main{padding:20px;max-width:540px;margin:0 auto 90px;}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;
  background:var(--bg);border-top:2px solid var(--line-strong);
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:10;
}
nav.tabs button{
  flex:1;border:none;background:none;padding:16px 4px;
  color:var(--sub);font-family:var(--mono);font-size:11px;letter-spacing:0.06em;
  cursor:pointer;border-right:1px solid var(--line);
}
nav.tabs button:last-child{border-right:none;}
nav.tabs button.active{
  color:var(--accent-ink);background:var(--accent);font-weight:600;
}

.view{display:none;} .view.active{display:block;}

.panel{
  background:var(--panel);border:1px solid var(--line);
  padding:16px;margin-bottom:16px;position:relative;
}

.btn{
  display:inline-block;border:1px solid var(--accent);border-radius:0;
  padding:11px 16px;font-family:var(--mono);font-size:12px;letter-spacing:0.04em;
  cursor:pointer;background:var(--accent);color:var(--accent-ink);text-align:center;
}
.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn.secondary:hover{border-color:var(--line-strong);}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger);}
.btn.block{display:block;width:100%;}
.btn:disabled{opacity:0.3;cursor:not-allowed;}

input[type=text], select, textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:0;
  background:var(--panel-active);color:var(--ink);font-size:13px;margin:6px 0 14px;
  box-sizing:border-box;font-family:inherit;outline:none;
}
input[type=text]:focus, textarea:focus, select:focus{
  border-color:var(--line-strong);
}
textarea{min-height:80px;resize:vertical;}
label.field-label{
  font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--sub);
  letter-spacing:0.05em;display:block;margin-top:4px;
}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.specimen-card{
  background:var(--panel);border:1px solid var(--line);
  padding:8px;cursor:pointer;transition:border-color 0.15s;
}
.specimen-card:hover{border-color:var(--line-strong);}
.specimen-thumb-wrap{
  aspect-ratio:1;width:100%;background:var(--bg);position:relative;overflow:hidden;
  border-bottom:1px solid var(--line);
}
.specimen-thumb{width:100%;height:100%;object-fit:cover;}
.specimen-thumb.masked{
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10px;color:var(--sub);letter-spacing:0.08em;
}
.specimen-meta{padding:8px 4px 4px;}
.specimen-idx{font-family:var(--mono);font-size:9px;color:var(--sub);letter-spacing:0.04em;}
.specimen-name{font-size:12px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.finder-box{
  position:relative;background:#000000;margin-bottom:16px;
  border:1px solid var(--line);display:none;aspect-ratio:1/1;overflow:hidden;
}
.finder-box img{width:100%;height:100%;object-fit:cover;}
.finder-box::before, .finder-box::after{
  content:"";position:absolute;width:16px;height:16px;pointer-events:none;z-index:2;
}
.finder-box::before{
  top:12px;left:12px;border-top:2px solid rgba(255,255,255,0.7);border-left:2px solid rgba(255,255,255,0.7);
}
.finder-box::after{
  bottom:12px;right:12px;border-bottom:2px solid rgba(255,255,255,0.7);border-right:2px solid rgba(255,255,255,0.7);
}
.finder-crosshair{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:16px;height:16px;pointer-events:none;z-index:2;
}
.finder-crosshair::before{content:"";position:absolute;top:7px;left:0;right:0;height:1px;background:rgba(255,255,255,0.4);}
.finder-crosshair::after{content:"";position:absolute;left:7px;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.4);}

.empty{
  font-family:var(--serif);color:var(--sub);font-size:13px;text-align:center;
  padding:60px 10px;line-height:1.8;letter-spacing:0.04em;
}
.status-mono{font-family:var(--mono);font-size:11px;color:var(--sub);margin:10px 0;}
.warn-box{
  background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);
  padding:12px;font-size:11px;line-height:1.5;margin-bottom:14px;
}
.warn-box .title{font-family:var(--mono);font-weight:600;margin-bottom:4px;}

/* アングルサムネイル一覧 */
.angle-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:8px 0 12px;}
.angle-thumb-wrap{
  position:relative;width:58px;height:58px;flex-shrink:0;background:var(--bg);
  border:2px solid transparent;cursor:pointer;transition:border-color 0.15s;
}
.angle-thumb-wrap.active{
  border-color:var(--line-strong);
}
.angle-thumb{width:100%;height:100%;object-fit:cover;}
.angle-del-btn{
  position:absolute;top:0;right:0;width:16px;height:16px;border-radius:0;
  background:var(--danger);color:#fff;border:none;font-size:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;z-index:3;
}
.file-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;
}
.file-row:last-child{border-bottom:none;}
</style>
</head>
<body>

<header>
  <div class="title-area">
    <h1>モノの記憶</h1>
    <p id="headerStatus">INITIALIZING CORE ENGINE...</p>
  </div>
  <div class="status-tag">HARDENED VAULT</div>
</header>

<main>
  <!-- 一覧画面 -->
  <section id="view-list" class="view active">
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn secondary" id="backupAllBtn" style="flex:1;">BACKUP ALL</button>
      <button class="btn secondary" id="restoreBtn" style="flex:1;">RESTORE</button>
    </div>
    <input type="file" id="restoreFileInput" accept=".encbak" style="display:none;">
    <div id="listEmpty" class="empty">登録されている物体はありません。<br>「REGIST」から現物を記録してください。</div>
    <div id="listGrid" class="grid"></div>
  </section>

  <!-- 登録画面 -->
  <section id="view-add" class="view">
    <div class="panel">
      <div id="addFinder" class="finder-box">
        <img id="addPreview">
        <div class="finder-crosshair"></div>
      </div>

      <input type="file" accept="image/*" capture="environment" id="addPhotoInput" style="display:none;">
      <button class="btn block" id="addPhotoBtn">[ CAPTURE SPECIMEN ]</button>
      
      <div id="addDuplicateBox" class="warn-box" style="display:none;margin-top:14px;">
        <div class="title" id="addDuplicateMsg">DUPLICATE DETECTED</div>
        <div style="margin-bottom:10px;">既存のデータと特徴ベクトルが酷似しています。二重登録は照合不整合の原因になります。</div>
        <div style="display:flex;gap:8px;">
          <button class="btn secondary" id="addOpenExistingBtn" style="flex:1;padding:6px;font-size:10px;">既存を開く</button>
          <button class="btn secondary" id="addIgnoreDuplicateBtn" style="flex:1;padding:6px;font-size:10px;">重複を無視</button>
        </div>
      </div>

      <label class="field-label" style="margin-top:14px;">IDENTIFIER</label>
      <input type="text" id="addName" placeholder="記録名・識別子">
      
      <label class="field-label">MEMORANDUM</label>
      <textarea id="addNote" placeholder="任意の記録・覚書"></textarea>
      
      <label class="field-label">SECURITY RESTRICTION</label>
      <select id="addSecurity">
        <option value="standard">STANDARD（通常表示・平文）</option>
        <option value="file-lock">FILE LOCK（現物照合までファイルを暗号化隔離）</option>
        <option value="masked">MASKED（現物照合まで外観・内容を完全暗号化）</option>
        <option value="hidden">HIDDEN（一覧除外・完全暗号化ステルス）</option>
      </select>

      <label class="field-label">MATCHING TOLERANCE</label>
      <select id="addThreshold">
        <option value="0.75" selected>0.75 [STANDARD] - 標準</option>
        <option value="0.82">0.82 [STRICT] - 厳格（無地・単色物）</option>
        <option value="0.70">0.70 [TOLERANT] - 寛容（複雑な立体物）</option>
      </select>
      
      <button class="btn block" id="addSaveBtn" style="margin-top:10px;" disabled>COMMIT TO VAULT</button>
      <p class="status-mono" id="addStatus"></p>
    </div>
  </section>

  <!-- 照合画面 -->
  <section id="view-find" class="view">
    <div class="panel">
      <div id="findFinder" class="finder-box">
        <img id="findPreview">
        <div class="finder-crosshair"></div>
      </div>

      <input type="file" accept="image/*" capture="environment" id="findPhotoInput" style="display:none;">
      <button class="btn block" id="findPhotoBtn">[ SCAN OBJECT ]</button>
      <p class="status-mono" id="findStatus"></p>
    </div>
    <div id="findResult"></div>
  </section>

  <!-- 詳細・編集画面 -->
  <section id="view-detail" class="view">
    <button class="btn secondary" id="detailBack" style="margin-bottom:14px;padding:6px 12px;font-size:11px;">← RETURN TO INDEX</button>
    
    <div id="detailLockNotice" class="warn-box" style="display:none;">
      <div class="title">RESTRICTED & ENCRYPTED</div>
      現物照合が行われていないため、データは暗号化されたまま保護されています。
    </div>

    <div class="panel">
      <!-- メインファインダー（サムネイルタップで切り替え表示） -->
      <div id="detailFinder" class="finder-box" style="display:block;">
        <img id="detailPhoto">
      </div>
      
      <div id="detailAnglesCard">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <label class="field-label" style="margin:0;">REGISTERED KEYS / ANGLES</label>
          <button class="btn secondary" id="detailAddAngleBtn" style="padding:4px 8px;font-size:10px;">+ ADD KEY</button>
        </div>
        <p class="status-mono" id="detailAngleStatus" style="display:none;"></p>
        <input type="file" accept="image/*" capture="environment" id="detailAddAngleInput" style="display:none;">
        <div class="angle-strip" id="detailAngleStrip"></div>
      </div>

      <h2 id="detailName" style="font-family:var(--serif);font-size:17px;font-weight:600;margin:12px 0 10px;"></h2>
      
      <label class="field-label">MEMORANDUM</label>
      <textarea id="detailNote"></textarea>
      
      <label class="field-label">SECURITY RESTRICTION</label>
      <select id="detailSecurity">
        <option value="standard">STANDARD</option>
        <option value="file-lock">FILE LOCK</option>
        <option value="masked">MASKED</option>
        <option value="hidden">HIDDEN</option>
      </select>

      <label class="field-label">MATCHING TOLERANCE</label>
      <select id="detailThreshold">
        <option value="0.75">0.75 [STANDARD]</option>
        <option value="0.82">0.82 [STRICT]</option>
        <option value="0.70">0.70 [TOLERANT]</option>
      </select>
    </div>

    <div class="panel" id="detailFilesCard">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:0.04em;">ATTACHED FILES</span>
        <button class="btn secondary" id="detailAddFile" style="padding:4px 8px;font-size:10px;">+ ATTACH</button>
      </div>
      <input type="file" id="detailFileInput" multiple style="display:none;">
      <div id="detailFiles"></div>
    </div>

    <div class="panel" style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn secondary block" id="detailExportBtn">EXPORT SPECIMEN (ENCRYPTED)</button>
      <button class="btn danger block" id="detailDeleteBtn">PURGE SPECIMEN</button>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-view="list" class="active">INDEX</button>
  <button data-view="add">REGIST</button>
  <button data-view="find">SCAN</button>
</nav>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

env.allowLocalModels = false;

const DEFAULT_THRESHOLD = 0.75;
const DUPLICATE_THRESHOLD = 0.82;

let db, extractor, deviceMasterKey=null;
let addBlob=null, addEmbeddingGroup=[], findBlob=null, currentDetailId=null;
let duplicateCandidateId = null;
let currentActivePhotoIdx = 0; // 詳細画面で現在プレビュー中の写真インデックス

const unlockedSessions = new Set();
const unlockedPayloadCache = new Map();

function lockAllSessions(){
  if(unlockedSessions.size > 0){
    unlockedSessions.clear();
    unlockedPayloadCache.clear();
    const activeView = document.querySelector('.view.active')?.id;
    if(activeView === 'view-detail') showView('list');
    else if(activeView === 'view-list') renderList();
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) lockAllSessions();
});

function openDb(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('mono-no-kioku', 5);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', {keyPath:'id'});
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', {keyPath:'id'});
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}
function idbAll(){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readonly').objectStore('items').getAll(); tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error); }); }
function idbPut(item){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readwrite').objectStore('items').put(item); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbDelete(id){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readwrite').objectStore('items').delete(id); tx.onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); }); }
function idbGet(id){ return new Promise((res,rej)=>{ const tx=db.transaction('items','readonly').objectStore('items').get(id); tx.onsuccess=()=>res(tx.result); tx.onerror=()=>rej(tx.error); }); }

async function getOrCreateDeviceMasterKey(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction('meta', 'readwrite');
    const store = tx.objectStore('meta');
    const req = store.get('device_master_key');
    req.onsuccess = async () => {
      if (req.result && req.result.key) {
        resolve(req.result.key);
      } else {
        const newKey = await crypto.subtle.generateKey(
          { name: 'AES-GCM', length: 256 },
          false,
          ['encrypt', 'decrypt']
        );
        store.put({ id: 'device_master_key', key: newKey });
        resolve(newKey);
      }
    };
    req.onerror = () => reject(req.error);
  });
}

async function encryptWithDeviceKey(key, plainBytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plainBytes);
  const out = new Uint8Array(iv.length + cipher.byteLength);
  out.set(iv, 0);
  out.set(new Uint8Array(cipher), iv.length);
  return out;
}

async function decryptWithDeviceKey(key, cipherBytes){
  const iv = cipherBytes.slice(0, 12);
  const data = cipherBytes.slice(12);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new Uint8Array(plain);
}

function safeObjectUrl(source){
  if (!source) return '';
  try {
    if (source instanceof Blob) {
      return URL.createObjectURL(source);
    }
    if (typeof source === 'string') {
      if (source.startsWith('data:') || source.startsWith('blob:')) return source;
      return URL.createObjectURL(base64ToBlob(source, 'image/jpeg'));
    }
    if (source.data && source.type) {
      return URL.createObjectURL(base64ToBlob(source.data, source.type));
    }
  } catch (err) {
    console.error('safeObjectUrl failed:', err);
  }
  return '';
}

async function cropCenterSquareAndDownscale(file, size = 800, quality = 0.85){
  const bmp = await createImageBitmap(file);
  const minSide = Math.min(bmp.width, bmp.height);
  const sx = Math.round((bmp.width - minSide) / 2);
  const sy = Math.round((bmp.height - minSide) / 2);

  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bmp, sx, sy, minSide, minSide, 0, 0, size, size);
  bmp.close();
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

async function generateRotatedBlobs(squareBlob){
  const bmp = await createImageBitmap(squareBlob);
  const size = bmp.width;
  const angles = [90, 180, 270];
  const results = [];

  for (const deg of angles) {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.translate(size / 2, size / 2);
    ctx.rotate((deg * Math.PI) / 180);
    ctx.drawImage(bmp, -size / 2, -size / 2);
    const b = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
    results.push(b);
  }
  bmp.close();
  return results;
}

async function embed(blob){
  const url = URL.createObjectURL(blob);
  try {
    const output = await extractor(url);
    const hiddenDim = 384;
    const numPatches = 196;
    const rawData = output.data;

    const cls = new Float32Array(hiddenDim);
    for (let i = 0; i < hiddenDim; i++) cls[i] = rawData[i];

    const patchMean = new Float32Array(hiddenDim);
    for (let p = 1; p <= numPatches; p++) {
      const offset = p * hiddenDim;
      for (let i = 0; i < hiddenDim; i++) {
        patchMean[i] += rawData[offset + i];
      }
    }
    for (let i = 0; i < hiddenDim; i++) patchMean[i] /= numPatches;

    let sumSq = 0;
    const hybrid = new Float32Array(hiddenDim);
    for (let i = 0; i < hiddenDim; i++) {
      const val = cls[i] + patchMean[i];
      hybrid[i] = val;
      sumSq += val * val;
    }
    const norm = Math.sqrt(sumSq) || 1.0;

    const embedding = new Array(hiddenDim);
    for (let i = 0; i < hiddenDim; i++) embedding[i] = hybrid[i] / norm;
    return embedding;
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function extract4WayEmbeddings(baseBlob, progressCb){
  const embeddings = [];
  
  if (progressCb) progressCb('0° (BASE)');
  const emb0 = await embed(baseBlob);
  embeddings.push(emb0);

  const rotatedBlobs = await generateRotatedBlobs(baseBlob);
  const degrees = [90, 180, 270];

  for (let i = 0; i < rotatedBlobs.length; i++) {
    if (progressCb) progressCb(`${degrees[i]}° (ROTATION)`);
    const emb = await embed(rotatedBlobs[i]);
    embeddings.push(emb);
  }

  return embeddings;
}

function cosine(a, b){
  if (!a || !b || a.length !== b.length) return 0;
  let dot = 0;
  for (let i = 0; i < a.length; i++) dot += a[i] * b[i];
  return Math.max(-1, Math.min(1, dot));
}

function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64, type){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type});
}

async function secureItemForStorage(rawItem){
  const sec = rawItem.security || 'standard';
  if(sec === 'standard'){
    return rawItem;
  }

  const photosB64 = [];
  for(const p of rawItem.photos){
    photosB64.push({ type: p.type, data: await blobToBase64(p) });
  }
  const filesB64 = [];
  for(const f of (rawItem.files || [])){
    filesB64.push({ name: f.name, type: f.blob.type, data: await blobToBase64(f.blob) });
  }

  if(sec === 'file-lock'){
    const plainFilesBytes = new TextEncoder().encode(JSON.stringify(filesB64));
    const encryptedFiles = await encryptWithDeviceKey(deviceMasterKey, plainFilesBytes);
    return {
      ...rawItem,
      files: [],
      encryptedFiles: encryptedFiles
    };
  }

  const sensitivePayload = {
    name: rawItem.name,
    note: rawItem.note || '',
    photos: photosB64,
    files: filesB64
  };
  const plainBytes = new TextEncoder().encode(JSON.stringify(sensitivePayload));
  const encryptedPayload = await encryptWithDeviceKey(deviceMasterKey, plainBytes);

  return {
    id: rawItem.id,
    security: sec,
    threshold: rawItem.threshold,
    embeddings: rawItem.embeddings,
    createdAt: rawItem.createdAt,
    name: '[RESTRICTED]',
    note: '',
    photos: [],
    files: [],
    encryptedPayload: encryptedPayload
  };
}

async function resolveItemPayload(storedItem, isUnlocked){
  const sec = storedItem.security || 'standard';
  if(sec === 'standard') return storedItem;

  if(unlockedPayloadCache.has(storedItem.id)){
    return unlockedPayloadCache.get(storedItem.id);
  }

  if(!isUnlocked){
    return storedItem;
  }

  if(sec === 'file-lock' && storedItem.encryptedFiles){
    try {
      const plainBytes = await decryptWithDeviceKey(deviceMasterKey, storedItem.encryptedFiles);
      const filesB64 = JSON.parse(new TextDecoder().decode(plainBytes));
      const resolvedFiles = filesB64.map(f => ({ name: f.name, blob: base64ToBlob(f.data, f.type) }));
      const fullItem = { ...storedItem, files: resolvedFiles };
      unlockedPayloadCache.set(storedItem.id, fullItem);
      return fullItem;
    } catch(e) {
      console.error('File decrypt error:', e);
      return storedItem;
    }
  }

  if((sec === 'masked' || sec === 'hidden') && storedItem.encryptedPayload){
    try {
      const plainBytes = await decryptWithDeviceKey(deviceMasterKey, storedItem.encryptedPayload);
      const payload = JSON.parse(new TextDecoder().decode(plainBytes));
      const resolvedPhotos = payload.photos.map(p => base64ToBlob(p.data, p.type));
      const resolvedFiles = payload.files.map(f => ({ name: f.name, blob: base64ToBlob(f.data, f.type) }));
      const fullItem = {
        ...storedItem,
        name: payload.name,
        note: payload.note,
        photos: resolvedPhotos,
        files: resolvedFiles
      };
      unlockedPayloadCache.set(storedItem.id, fullItem);
      return fullItem;
    } catch(e) {
      console.error('Payload decrypt error:', e);
      return storedItem;
    }
  }

  return storedItem;
}

// 暗号化エクスポート
async function deriveKey(password, salt){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
async function encryptBytes(password, plainBytes){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plainBytes);
  const out = new Uint8Array(salt.length + iv.length + cipher.byteLength);
  out.set(salt,0); out.set(iv, salt.length); out.set(new Uint8Array(cipher), salt.length+iv.length);
  return out;
}
async function decryptBytes(password, bytes){
  const salt = bytes.slice(0,16), iv = bytes.slice(16,28), cipher = bytes.slice(28);
  const key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, cipher);
  return new Uint8Array(plain);
}

async function exportItemsEncrypted(rawItems, defaultFileName){
  const password = prompt('暗号化パスワード（合言葉）を入力してください:');
  if(!password) return;

  const includeNote = confirm('メモ（MEMORANDUM）を含めて書き出しますか？\n（キャンセルを選ぶとファイルのみ出力されます）');

  const serial = [];
  for(const storedIt of rawItems){
    const it = await resolveItemPayload(storedIt, true);

    const files = [];
    for(const f of (it.files||[])) files.push({name:f.name, type:f.blob.type, data: await blobToBase64(f.blob)});
    
    const photosSrc = (it.photos && it.photos.length) ? it.photos : [it.photo];
    const photosB64 = [];
    for(const p of photosSrc){
      photosB64.push({ type: p.type, data: await blobToBase64(p) });
    }

    serial.push({
      id: it.id,
      name: it.name,
      note: includeNote ? (it.note || '') : '',
      security: it.security || 'standard',
      threshold: it.threshold !== undefined ? it.threshold : DEFAULT_THRESHOLD,
      embeddings: it.embeddings || [it.embedding],
      createdAt: it.createdAt,
      photos: photosB64,
      files
    });
  }

  const jsonBytes = new TextEncoder().encode(JSON.stringify(serial));
  const encrypted = await encryptBytes(password, jsonBytes);
  const blob = new Blob([encrypted], {type:'application/octet-stream'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = defaultFileName;
  document.body.appendChild(a); a.click(); a.remove();
}

        security: it.security || 'standard',
        threshold: it.threshold !== undefined ? it.threshold : DEFAULT_THRESHOLD,
        embeddings: it.embeddings || [it.embedding],
        photos,
        files,
        createdAt: it.createdAt
      };

      const securedItem = await secureItemForStorage(rawRestored);
      await idbPut(securedItem);
    }
    alert(`RESTORE COMPLETE: ${serial.length} SPECIMENS`);
    renderList();
  }catch(err){
    alert('復号失敗: パスワード不一致、またはファイル破損');
  }
};

(async function init(){
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
  try{
    db = await openDb();
    deviceMasterKey = await getOrCreateDeviceMasterKey();
  }catch(err){
    document.body.innerHTML = '<p style="padding:20px;font-family:var(--mono);">ERROR: STORAGE INITIALIZATION FAILED</p>';
    return;
  }
  
  const statusEl = document.getElementById('headerStatus');
  try {
    extractor = await pipeline('image-feature-extraction', 'Xenova/dino-vits16', {
      quantized: true,
      progress_callback: (p) => {
        if (p.status === 'progress') {
          statusEl.textContent = `LOADING WEIGHTS (${Math.round(p.progress || 0)}%)`;
        }
      }
    });
  } catch(err) {
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = `CORE ERROR: ${err.message || err}`;
    console.error(err);
    return;
  }
  
  statusEl.textContent = 'SYSTEM READY // ROTATION INVARIANT';
  renderList();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
